<!-- Navigation -->
<nav class="navbar navbar-expand-lg fixed-top" id="mainNav" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand" href="{{ site.baseurl }}/#">
      {%- if site.logo -%}
        <img src="{{ site.logo.path | relative_url }}" alt="{{ site.title | default: 'Home' }}" width="auto" height="90"/>
      {%- else -%}
        {{ site.title }}
      {%- endif -%}
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation menu">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ms-auto">
        {%- for link in site.data.navigation.nav -%}
          <li class="nav-item">
            {%- if link.url -%}
              <a class="nav-link" href="{{ link.url }}">{{ link.title }}</a>
            {%- else if link.section -%}
              <a class="nav-link" href="{{ site.baseurl }}/#{{ link.section }}">{{ link.title }}</a>
            {%- else -%}
              <a class="nav-link" href="#">{{ link.title }}</a>
            {%- endif -%}
          </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
<!-- End Navigation -->
